services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: 'https://urnik.live/api'
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: 'urnik.live,.urnik.live'
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: backend
    ports:
      - '5013:5013'
    environment:
      # Same POSTGRES_* values the database container is created with, so the two can never
      # disagree. Only the host differs: inside the compose network the database answers as
      # "database" on 5432, whatever port it is published on outside.
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LOG_FILE_DIRECTORY: /app/Data/Logs
      Jwt__Secret: '${Jwt__Secret}'
      Jwt__Issuer: '${Jwt__Issuer}'
      Jwt__Audience: '${Jwt__Audience}'
      Google__ClientId: '${Google__ClientId}'
      Google__ClientSecret: '${Google__ClientSecret}'
      Frontend__Url: '${Frontend__Url}'
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "bash -c 'echo > /dev/tcp/127.0.0.1/5013' "]
      interval: 5s
      timeout: 5s
      retries: 20

  database:
    image: postgres:16
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Published on POSTGRES_PORT (default 5433), NOT 5432. A locally installed PostgreSQL
      # service already owns 5432 on the dev machine, and when it does this container cannot
      # bind — while anything pointing at localhost:5432 silently reaches the wrong server with
      # the wrong credentials. Free 5432 and set POSTGRES_PORT=5432 if you prefer the default.
      # Only the host sees this port; the backend container reaches the database at
      # database:5432 on the compose network either way.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    profiles: ['tools']
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - '5050:80'
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
