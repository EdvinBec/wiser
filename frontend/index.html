  <body>
    <script>
      (function () {
        try {
          var saved =
            localStorage.getItem('themeV2') || localStorage.getItem('themeV1');
          var isDark =
            saved === 'dark' ||
            (!saved &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"></script>
  </body>
