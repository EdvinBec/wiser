server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a tunnel the real scheme and address arrive in headers; keep them in the log so a
    # problem can be traced to a visitor rather than to the tunnel.
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Hashed assets never change under the same name, so they can be held indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker and the manifest decide WHEN the app updates. Cached, a stale worker
    # keeps serving the old bundle long after a deploy, and the update never reaches anyone.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # ── API ─────────────────────────────────────────────────────────────────
    # The backend's three route prefixes, proxied on the SAME origin as the page. That is what
    # makes the browser issue no cross-origin request at all: no preflight, no CORS header to
    # keep in step with the domain. The paths are passed through unchanged, so what the backend
    # sees is exactly what it routes on.
    #
    # Only the tunnel reaches this container, and only this container reaches the backend —
    # which binds to loopback on the host and is otherwise unreachable.
    # /signin-google is where Google returns the visitor. It is handled by the OAuth
    # middleware rather than by a controller, so it sits outside the three route prefixes and
    # has to be named explicitly — without it the callback lands on the SPA and login dies
    # silently at the last step.
    location ~ ^(?:/(?:api|auth|user)/|/signin-google) {
        proxy_pass http://backend:5013;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Stated, not forwarded. Only the tunnel reaches this container and the edge always
        # terminates HTTPS, so the scheme is known here — whereas passing the client's own
        # $http_x_forwarded_proto through meant an ABSENT header left the backend believing the
        # request was plain http. That is not cosmetic: the OAuth correlation cookie defaults to
        # SameSite=None with SecurePolicy=SameAsRequest, so it then went out without Secure,
        # every browser dropped it on the floor, and sign-in died at the callback with
        # "Correlation failed" and a bare 500. It was client-settable as well.
        proxy_set_header X-Forwarded-Proto https;

        # A cold Wise catalogue fetch can take a few seconds upstream.
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        add_header Cache-Control "no-store" always;
    }

    # Single-page app: every unknown path is a client route, not a missing file.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
